[project]
name = "sa_spec"
version = "0.0.0"

[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.scikit-build.cmake]
build-type = "Release"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
editable.rebuild = true
